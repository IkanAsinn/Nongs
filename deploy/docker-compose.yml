# Nongs on a VPS with Dokploy: create a "Compose" service from this repository
# with this file, fill in the variables below in Dokploy's Environment tab, and
# give two domains in Dokploy's Domains tab:
#
#   game.example.com   -> service "game",  port 5181  (the game, the API and the game server)
#   voice.example.com  -> service "livekit", port 7880 (voice signalling only)
#
# Dokploy's Traefik gives both HTTPS. The voice itself does not go through
# Traefik: open these ports on the VPS firewall, straight to the livekit service:
#   7881/tcp, 7882/udp (media), 3478/udp (TURN, for players behind strict firewalls)
#
# Variables (Dokploy > Environment):
#   POSTGRES_PASSWORD   a long random password
#   LIVEKIT_API_KEY     any name, e.g. nongs
#   LIVEKIT_API_SECRET  a long random string (at least 32 characters)
#   VOICE_DOMAIN        voice.example.com

services:
  game:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://nongs:${POSTGRES_PASSWORD}@postgres:5432/nongs
      LIVEKIT_URL: wss://${VOICE_DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '5181'

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nongs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nongs
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nongs']
      interval: 5s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      # LiveKit reads "key: secret" pairs from here.
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}'
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    expose:
      - '7880'
    ports:
      - '7881:7881/tcp'
      - '7882:7882/udp'
      - '3478:3478/udp'

volumes:
  postgres:
