# LiveKit for Nongs: one LiveKit room per zone of the house. The keys come
# from LIVEKIT_KEYS (see docker-compose.yml), so no secret is kept here.
port: 7880
rtc:
  # Single-port mode: all media over one UDP port, with TCP as a fallback.
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
turn:
  # For players behind strict firewalls, over UDP. (TURN over TLS on 5349 also
  # needs a certificate: add tls_port, cert_file and key_file here if wanted.)
  enabled: true
  udp_port: 3478
room:
  # Rooms are made when the first player joins a zone and closed soon after the last one leaves.
  empty_timeout: 60
  max_participants: 16
logging:
  level: info
